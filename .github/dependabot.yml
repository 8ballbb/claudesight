version: 2
updates:
  # The release pipeline's own actions rot silently: nothing in CI notices that
  # actions/checkout@v5 has moved on. These are the actions that publish to npm,
  # so they are the ones most worth keeping current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `ci:` keeps these out of the release notes and, per the release script,
      # a lockfile-free action bump alone does not trigger a publish.
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      # React is compiled into the UI bundle, so a dependency bump genuinely
      # changes what users receive — `fix:` is accurate, and it ships.
      prefix: fix
      prefix-development: ci
