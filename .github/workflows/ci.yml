name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a bump size instead of deriving it from commits'
        required: false
        default: ''
        type: choice
        options: ['', 'patch', 'minor', 'major']

# On a branch, a second push makes the first run pointless. On main it does
# not: a run cancelled partway through `release` can land between publishing
# to npm and pushing the tag that records it, leaving the next run unable to
# work out where it left off. main runs queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # macOS only, matching the app: bin/claudesight.js refuses to start
    # anywhere else, and the platform-dependent paths — the Trash mechanism,
    # filesystem case folding — have never run on another platform. Adding a
    # platform means adding its runner here in the same change.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and current.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` runs `prepare`, which builds the UI — so this also proves a
      # fresh clone produces a servable app, not just a passing suite.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Non-blocking: warns when SchemaStore has synced the settings schema to
      # a newer Claude Code version than the bundled copy, so someone runs the
      # refresh. It must never block a release — a stale-but-present catalogue
      # is still useful, and it advises rather than gates — so it is allowed to
      # fail. Runs once (Node 22) to avoid two identical GitHub API hits.
      - name: Warn if the settings schema has drifted
        if: matrix.node == '22'
        continue-on-error: true
        run: node scripts/refresh-settings-schema.mjs --check

      - name: The built UI must exist after a clean install
        run: test -f dist/index.html && test -n "$(ls dist/assets/*.js)"

      - name: The server starts and answers on its fixed port
        run: |
          node bin/claudesight.js &
          for i in $(seq 1 20); do
            sleep 0.5
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7717/ || true)
            [ "$code" = "200" ] && break
          done
          test "$code" = "200" || { echo "server never answered (last code: $code)"; exit 1; }

      - name: A page on another site cannot drive the API
        run: |
          origin=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://evil.example' http://127.0.0.1:7717/api/inventory)
          form=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:7717' -H 'content-type: text/plain' \
            -d '{}' http://127.0.0.1:7717/api/write)
          host=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Host: evil.example' http://127.0.0.1:7717/api/inventory)
          echo "cross-origin=$origin form-shaped=$form rebinding=$host"
          test "$origin" = "403" && test "$form" = "415" && test "$host" = "403"

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Runtime dependencies are react, react-dom and yaml. A moderate advisory
      # in build tooling should not block a pull request, but a high one in
      # anything should be looked at.
      - run: npm audit --audit-level=high

  # Publishing happens only after the full matrix and the audit are green, in
  # the same run, on the same commit — `needs` is a hard dependency, unlike a
  # cross-workflow trigger that can fire on a different tree.
  release:
    needs: [test, audit]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-latest

    # Publishing is a deployment, so it gets a deployment record. This gives the
    # run an audit trail, scopes the npm credential to this job alone, and is the
    # hook a required reviewer would attach to if a manual gate is ever wanted.
    environment: release

    permissions:
      contents: write   # push the release commit, the tag, and the GitHub release
      id-token: write   # sign the npm provenance attestation

    steps:
      - uses: actions/checkout@v7
        with:
          # Deriving the version means reading every tag and every commit
          # since the last one. A shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Node 22 ships npm 10.9.8; OIDC trusted publishing needs 11.5.1+.
      - run: npm install -g npm@^11.5.2

      - run: npm ci

      - name: Work out whether this push is a release, and which version
        id: plan
        env:
          FORCE_BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.js >> "$GITHUB_OUTPUT"

      - name: Nothing to publish
        if: steps.plan.outputs.release == 'no'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "No release — $REASON"

      - name: Record the version in the repository
        if: steps.plan.outputs.release == 'yes'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # The tag is created locally and pushed only after npm accepts the
          # publish. Everything before the publish is reversible; the publish
          # is not. If it fails, nothing has left this runner.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "refusing to release a version that is not a semver triple: $VERSION"
            exit 1
          }

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `npm version` errors on a no-op, and two real cases ask for one:
          # the first release, which ships the version package.json already
          # declares, and a push where somebody bumped it by hand.
          if [ "$(node -p 'require("./package.json").version')" = "$VERSION" ]; then
            echo "package.json already declares $VERSION"
          else
            npm version "$VERSION" --no-git-tag-version
          fi

          {
            echo "# Changelog"
            echo
            echo "## v$VERSION — $(date -u +%Y-%m-%d)"
            echo
            cat release-notes.md
            if [ -f CHANGELOG.md ]; then
              echo
              # Drop the old file's own heading and the blank line under it.
              awk 'NR<=2 && (/^# Changelog$/ || /^$/) { next } { print }' CHANGELOG.md
            fi
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

          git add package.json package-lock.json CHANGELOG.md
          # On the first release only the changelog is new, so there is always
          # something staged; a later release always changes the version too.
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

      # No token. npm trusts this repository, this workflow FILENAME and this
      # environment, and accepts a short-lived OIDC credential minted per run.
      # Renaming ci.yml or the `release` environment breaks the trust: npm
      # fixes both at creation time and they cannot be edited afterwards.
      - name: Publish to npm
        if: steps.plan.outputs.release == 'yes'
        run: npm publish --provenance --access public

      - name: Push the release commit and its tag
        if: steps.plan.outputs.release == 'yes'
        env:
          VERSION: v${{ steps.plan.outputs.version }}
        run: |
          # A push authenticated with GITHUB_TOKEN does not start another
          # workflow run, so the release commit cannot trigger a release.
          for attempt in 1 2 3; do
            if git push --follow-tags origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto main and retrying"
            git pull --rebase origin main
            # The rebase rewrote the release commit; the annotated tag is still
            # on the original, which is no longer on any branch. Move it.
            git tag -f -a "$VERSION" -m "$VERSION" HEAD
          done
          echo "could not push the release commit; $VERSION IS published to npm"
          exit 1

      - name: Announce it on GitHub
        if: steps.plan.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.plan.outputs.version }}" \
            --title "v${{ steps.plan.outputs.version }}" \
            --notes-file release-notes.md
